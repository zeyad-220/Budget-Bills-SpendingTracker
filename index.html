<h2 class="rise">${t('sections')}</h2><div class="gr">${S.sec.map(sc=>{const rec=sc.t=='rec',L=S.it.filter(i=>i.s==sc.id&&!(rec&&sk(i.id))),dn=L.filter(i=>rec?pd.includes(i.id):i.done);return `<a class="card sc rise" href="#s-${sc.id}"><span class="lb">${t(rec?'tRec':'tList')}</span><b>${esc(nm(sc))}</b><span class="sub">${t('prog',dn.length,L.length)} · ${f(sum(L.filter(i=>!dn.includes(i))))} ${cy()}</span><div class="pl"><i style="width:${L.length?dn.length/L.length*100:0}%"></i></div></a>`}).join('')}</div>
<h2 class="rise">${t('last14')}</h2><div class="card rise"><div class="bars">${days.map((x,i)=>`<div class="bar1${x[1]?' v':''}${x[0]==T?' on':''}" title="${f(x[1])} ${cy()}"><i style="height:${x[1]/mx*85}%;--k:${i}"></i><b>${x[2]}</b></div>`).join('')}</div><p class="sub" style="margin-top:12px">${t('avg')}: ${f(mo/n.getDate())} ${cy()}</p></div>
<h2 class="rise">${t('byCat')}</h2><div class="card rise">${Object.entries(cat).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div class="cr"><span>${esc(catN(k))}</span><b>${f(v)}</b></div><div class="pl" style="margin:0"><i style="width:${v/cm*100}%"></i></div>`).join('')||`<p class="em" style="padding:12px">${t('noSpend')}</p>`}</div>
${urg.length?`<h2 class="rise">${t('top')} · ${esc(nm(tp))}</h2>${urg.map(i=>row(i,secOf(i.s))).join('')}`:''}`}
function render(q,pop){const h=location.hash.slice(1);R=h=='spend'||h=='set'||(h.startsWith('s-')&&S.sec.some(s=>'s-'+s.id==h))?h:'home';
 const H=document.documentElement;H.lang=S.lang;H.dir=S.lang=='ar'?'rtl':'ltr';$('#brand').textContent=t('brand');$('#lg').textContent=t('lg');$('#fab').textContent=t('exp');
 $('#tabs').innerHTML=[['home',t('overview')],...S.sec.map(s=>['s-'+s.id,nm(s)]),['spend',t('spending')],['set',t('settings')]].map(([k,l])=>`<a href="#${k}"${k==R?' class="on"':''}>${esc(l)}</a>`).join('');
 const v=$('#v');v.classList.toggle('q',!!q);v.innerHTML=R=='home'?home():R=='spend'?spend():R=='set'?sett():secV(R.slice(2));
 v.querySelectorAll('.rise').forEach((e,i)=>e.style.setProperty('--i',Math.min(i,14)));
 if(pop){const c=v.querySelector('.ck.on[data-k="'+pop+'"]');if(c)c.classList.add('pop')}
 if(!q){cnt();const a=$('#tabs .on');if(a)a.scrollIntoView({inline:'center',block:'nearest'})}}
load();addEventListener('hashchange',()=>{scrollTo(0,0);render()});render();
</script>
